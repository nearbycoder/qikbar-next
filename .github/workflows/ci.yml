name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Typecheck library
        run: bun run --filter qikbar typecheck
      - name: Test library
        run: bun run --filter qikbar test
      - name: Build library
        run: bun run --filter qikbar build
      - name: Check website
        run: cd apps/web && bunx astro check
      - name: Build website
        run: bun run --filter @qikbar/web build
      - name: Build React example
        run: bun run --filter @qikbar/example-react build
