<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Dashboard — Qikbar vanilla example</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; background: #fafafa; color: #111; }
      html.dark body { background: #0b0b0d; color: #eee; }
      aside { border-right: 1px solid #8882; padding: 20px; }
      aside a { display: block; padding: 6px 8px; color: inherit; text-decoration: none; border-radius: 6px; }
      aside a:hover { background: #8881; }
      main { padding: 32px 48px; max-width: 760px; }
      .search { display: flex; gap: 8px; align-items: center; width: 100%; padding: 8px 10px; border: 1px solid #8884; border-radius: 8px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      .search kbd { margin-left: auto; font: 12px system-ui; opacity: .6; }
    </style>
  </head>
  <body>
    <aside>
      <button class="search" data-qikbar-open>Search… <kbd>⌘K</kbd></button>
      <nav aria-label="Workspace" style="margin-top: 16px">
        <a href="#/">Home</a>
        <a href="#/projects">Projects</a>
        <a href="#/inbox">Inbox</a>
        <a href="#/reports">Reports</a>
        <a href="#/settings">Settings</a>
        <a href="https://github.com/nearbycoder/qikbar-next">GitHub</a>
      </nav>
      <button data-qikbar="Sign out" data-qikbar-icon="log-out" style="margin-top: 16px" onclick="alert('Signed out')">Sign out</button>
    </aside>
    <main>
      <h1 id="welcome">Welcome back</h1>
      <p>Press <kbd>⌘K</kbd> / <kbd>Ctrl K</kbd>. Try typing <code>acme</code>, <code>12*(3+4)</code>, <code>5 km in mi</code>, or press <kbd>Tab</kbd> to ask AI.</p>
      <h2 id="activity">Recent activity</h2>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      <h2 id="billing">Billing overview</h2>
      <p>Your plan renews on November 1.</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
